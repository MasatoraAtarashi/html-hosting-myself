name: PR Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck / Lint / Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

  security:
    name: gitleaks / zizmor / audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: gitleaks
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          "$(go env GOPATH)/bin/gitleaks" detect --source . --verbose --redact

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: zizmor (GitHub Actions audit)
        # オフラインでローカルファイルのみ監査（zizmor は npm に無いので cargo で導入）
        run: |
          cargo install zizmor --locked
          "$HOME/.cargo/bin/zizmor" --min-severity low .github

      - name: Install deps for audit
        run: pnpm install --frozen-lockfile

      - name: pnpm audit
        run: pnpm audit --audit-level=high

  ash:
    name: ASH Security Scan
    if: |
      github.event_name == 'push'
      || (
        github.event_name == 'pull_request'
        && github.event.pull_request.head.repo.full_name == github.repository
        && github.event.pull_request.user.login != 'dependabot[bot]'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"

      - name: Install ASH
        run: |
          python -m pip install --user uv "git+https://github.com/awslabs/automated-security-helper.git@v3.5.4"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run ASH scan
        env:
          UV_CACHE_DIR: ${{ runner.temp }}/ash-uv-cache
          UV_TOOL_DIR: ${{ runner.temp }}/ash-uv-tools
        run: ash --mode local --config .ash.yml --fail-on-findings

      - name: Add ASH summary
        if: always()
        run: |
          if [ -f .ash/ash_output/reports/ash.summary.md ]; then
            cat .ash/ash_output/reports/ash.summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ASH summary report was not generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload ASH reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ash-security-reports
          path: .ash/ash_output/
          if-no-files-found: ignore
