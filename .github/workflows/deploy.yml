name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node
        # v4 / main push 限定トリガー + SHA ピン済みアクションのため、キャッシュ汚染リスクは許容する
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # zizmor: ignore[cache-poisoning] main push 限定 + SHA ピン済みのため許容
        with:
          node-version: 22
          # デプロイジョブは明示的にはキャッシュを使わない

      # lockfile があれば固定、なければ package.json から解決する（初回 seed 用）
      - name: Install
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install
          fi

      - name: Build
        run: pnpm build

      # wrangler-action は apiToken が空だと CLOUDFLARE_API_TOKEN を渡さず、D1 migrate で落ちる。
      # シークレット名は既存のまま。空ならここで明示的に失敗させる。
      - name: Require Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::GitHub Actions secret CLOUDFLARE_API_TOKEN が空です。Settings → Secrets and variables → Actions に設定し、Deploy を Re-run してください（権限: Workers Scripts:Edit / D1:Edit / Workers R2 Storage:Edit）。デプロイ先 Worker 名は html-hosting-myself です。"
            missing=1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::GitHub Actions secret CLOUDFLARE_ACCOUNT_ID が空です。Settings → Secrets and variables → Actions に設定し、Deploy を Re-run してください。"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      # research-host-db は別アカウントのため 7403 になる。このトークンが触れるアカウントに D1/R2 を作る。
      - name: Provision D1 and R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          pnpm exec wrangler whoami
          echo "Ensuring D1 html-hosting-myself-db exists..."
          pnpm exec wrangler d1 create html-hosting-myself-db
          echo "Ensuring R2 html-hosting-myself exists..."
          pnpm exec wrangler r2 bucket create html-hosting-myself
          set -e
          pnpm exec wrangler d1 list --json > /tmp/d1-list.json
          python3 <<'PY'
          from pathlib import Path
          import json
          raw = Path("/tmp/d1-list.json").read_text()
          start_candidates = [i for i in (raw.find("["), raw.find("{")) if i >= 0]
          if not start_candidates:
              raise SystemExit(f"wrangler d1 list --json が JSON を返しませんでした:\n{raw}")
          data = json.loads(raw[min(start_candidates):])
          if isinstance(data, dict):
              data = data.get("result") or data.get("databases") or []
          db = next((x for x in data if x.get("name") == "html-hosting-myself-db"), None)
          if not db:
              names = [x.get("name") for x in data]
              raise SystemExit(
                  "D1 html-hosting-myself-db を作成できませんでした。"
                  "CLOUDFLARE_ACCOUNT_ID がトークンのアカウントと不一致か、トークンに D1:Edit がありません。"
                  f" list={names}"
              )
          uid = db.get("uuid") or db.get("id")
          path = Path("wrangler.jsonc")
          text = path.read_text()
          needle = '"database_name": "html-hosting-myself-db",'
          if '"database_id"' not in text.split(needle, 1)[-1][:180]:
              text = text.replace(
                  needle,
                  needle + f'\n      "database_id": "{uid}",',
                  1,
              )
              path.write_text(text)
          print(f"Using D1 html-hosting-myself-db id={uid}")
          PY

      # 認証は API トークン方式（Cloudflare は wrangler デプロイ用 OIDC を未提供、2026-08 時点）。
      # トークンは Workers Scripts 編集の最小権限にすること。R2 を使うので Workers R2 Storage: Edit も必要。
      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply DB --remote

      - name: Deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
