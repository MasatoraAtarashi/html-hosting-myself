name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        # v4 / main push 限定トリガー + SHA ピン済みアクションのため、キャッシュ汚染リスクは許容する
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # zizmor: ignore[cache-poisoning] main push 限定 + SHA ピン済みのため許容
        with:
          node-version: 22
          # デプロイジョブは明示的にはキャッシュを使わない

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # wrangler-action は apiToken が空だと CLOUDFLARE_API_TOKEN を渡さず、D1 migrate で落ちる。
      # シークレット名は既存のまま。空ならここで明示的に失敗させる。
      - name: Require Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::GitHub Actions secret CLOUDFLARE_API_TOKEN が空です。Settings → Secrets and variables → Actions に設定し、Deploy を Re-run してください（権限: Workers Scripts:Edit / D1:Edit / Workers R2 Storage:Edit）。デプロイ先 Worker 名は html-hosting-myself です。"
            missing=1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::GitHub Actions secret CLOUDFLARE_ACCOUNT_ID が空です。Settings → Secrets and variables → Actions に設定し、Deploy を Re-run してください。"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      # 認証は API トークン方式（Cloudflare は wrangler デプロイ用 OIDC を未提供、2026-08 時点）。
      # トークンは Workers Scripts 編集の最小権限にすること。R2 を使うので Workers R2 Storage: Edit も必要。
      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply DB --remote

      - name: Deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
