name: Fetch Deploy run logs

on:
  push:
    branches: [cursor/fetch-deploy-logs-c375]
    paths-ignore:
      - "ci-run-*.txt"
      - "ci-run-*.json"

permissions:
  actions: read
  contents: write

concurrency:
  group: fetch-deploy-run-logs
  cancel-in-progress: false

jobs:
  fetch:
    name: Dump latest main CI runs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Fetch latest workflow runs on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo "# latest runs on main $(date -u +%H:%M:%S) poll3"
            echo "## deploy.yml"
            gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/runs?branch=main&per_page=1" --jq '.workflow_runs[] | {id,status,conclusion,head_sha,html_url,created_at,display_title}'
            echo "## pr.yml"
            gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/pr.yml/runs?branch=main&per_page=1" --jq '.workflow_runs[] | {id,status,conclusion,head_sha,html_url,created_at,display_title}'
            echo "## jobs for latest pr.yml"
            PR_ID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/pr.yml/runs?branch=main&per_page=1" --jq '.workflow_runs[0].id')
            echo "pr run $PR_ID"
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PR_ID}/jobs" --jq '.jobs[] | {id,name,status,conclusion,started_at,completed_at}'
            echo "## failed logs pr.yml"
            gh run view "$PR_ID" --repo "$GITHUB_REPOSITORY" --log-failed >> /tmp/pr-failed.log 2>&1 || true
            tail -n 80 /tmp/pr-failed.log
          } > ci-run-latest.txt

      - name: Commit dump
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-run-latest.txt
          if git diff --cached --quiet; then
            echo "No dump changes"
            exit 0
          fi
          git commit -m "ci: store latest main CI dump"
          git push
