<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>リサーチ書庫 — html-hosting-myself</title>
    <meta
      name="description"
      content="自分用の AI リサーチやメモ HTML を保存して、あとからスマホで見返す書庫"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="/">リサーチ書庫</a>
        <a class="header-action" href="#upload">置く</a>
      </div>
    </header>

    <main class="container">
      <section class="list-card" aria-labelledby="list-heading">
        <div class="list-toolbar">
          <div class="list-heading-block">
            <h1 id="list-heading">保存したページ</h1>
            <p id="list-count" class="muted"></p>
          </div>
          <label class="search-label">
            <span class="visually-hidden">タイトルで探す</span>
            <input
              id="host-search"
              type="search"
              placeholder="タイトルで探す"
              autocomplete="off"
              enterkeyhint="search"
            />
          </label>
        </div>
        <p id="list-empty" class="muted">
          まだ保存したページはありません。下の「新しく置く」から HTML や ZIP を追加できます。
        </p>
        <p id="list-none" class="muted" hidden>一致するページがありません。</p>
        <ul id="host-list" class="host-list"></ul>
      </section>

      <section class="upload-card" id="upload" aria-labelledby="upload-heading">
        <h2 id="upload-heading">新しく置く</h2>
        <p class="upload-lead">
          AI が生成した HTML や静的サイトの ZIP
          をドロップすると、書庫に残ります。既定は期限なしです。
        </p>
        <form id="upload-form">
          <label id="dropzone" class="dropzone" for="file-input">
            <input
              id="file-input"
              name="file"
              type="file"
              accept=".html,.htm,.zip,text/html,application/zip"
            />
            <span class="dropzone-title">.html または .zip をドロップ</span>
            <span class="dropzone-sub">タップして選択（10MB まで）</span>
            <span id="file-name" class="file-name"></span>
          </label>

          <div class="upload-row">
            <label class="ttl-label">
              保存期限
              <select id="ttl" name="ttl">
                <option value="keep" selected>期限なし（既定）</option>
                <option value="1d">1 日</option>
                <option value="7d">7 日</option>
                <option value="30d">30 日</option>
              </select>
            </label>
            <button class="button button-primary" type="submit">書庫に置く</button>
          </div>
        </form>
        <p id="form-message" class="form-message" role="status" aria-live="polite"></p>
        <div id="share-box" class="share-box" hidden>
          <label for="share-url">閲覧 URL</label>
          <div class="share-row">
            <input id="share-url" type="text" readonly />
            <button id="copy-link" class="button" type="button">コピー</button>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>
          書庫と閲覧 URL（<code>/p/*</code>）はログインなしで開けます。書き込みは
          <code>API_TOKEN</code> が Worker secret として設定されているときだけ Bearer
          認証が必要です。未設定の初回は、この画面から直接置けます。
        </p>
      </div>
    </footer>

    <script src="/main.js" type="module"></script>
  </body>
</html>
