<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>html-hosting-myself</title>
    <meta name="description" content="AI が作った HTML や静的サイトを置いて、短い URL で共有する" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <span class="brand">html-hosting-myself</span>
        <span class="header-note">自分用ホスティング</span>
      </div>
    </header>

    <main class="container">
      <section class="hero">
        <h1>HTML を置いて、URL で共有する</h1>
        <p class="lead">
          AI が生成した HTML や、静的サイトの ZIP をドロップしてください。短いスラッグの URL
          が発行されます。既定の公開期限は 7 日です。
        </p>
      </section>

      <section class="upload-card" aria-labelledby="upload-heading">
        <h2 id="upload-heading">アップロード</h2>
        <form id="upload-form">
          <label id="dropzone" class="dropzone" for="file-input">
            <input
              id="file-input"
              name="file"
              type="file"
              accept=".html,.htm,.zip,text/html,application/zip"
            />
            <span class="dropzone-title">ここに .html または .zip をドロップ</span>
            <span class="dropzone-sub">クリックして選択もできます（10MB まで）</span>
            <span id="file-name" class="file-name"></span>
          </label>

          <div class="upload-row">
            <label class="ttl-label">
              公開期限
              <select id="ttl" name="ttl">
                <option value="1d">1 日</option>
                <option value="7d" selected>7 日（既定）</option>
                <option value="30d">30 日</option>
                <option value="keep">期限なし</option>
              </select>
            </label>
            <button class="button button-primary" type="submit">ホストする</button>
          </div>
        </form>
        <p id="form-message" class="form-message" role="status" aria-live="polite"></p>
        <div id="share-box" class="share-box" hidden>
          <label for="share-url">共有 URL</label>
          <div class="share-row">
            <input id="share-url" type="text" readonly />
            <button id="copy-link" class="button" type="button">コピー</button>
          </div>
        </div>
      </section>

      <section class="list-card" aria-labelledby="list-heading">
        <h2 id="list-heading">最近のホスト</h2>
        <p id="list-empty" class="muted">まだホストがありません。</p>
        <ul id="host-list" class="host-list"></ul>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>
          ダッシュボードと共有 URL（<code>/p/*</code>）はログインなしで開けます。書き込みは
          <code>API_TOKEN</code> が Worker secret として設定されているときだけ Bearer
          認証が必要です。未設定の初回は、この画面から直接アップロードできます。
        </p>
      </div>
    </footer>

    <script src="/main.js" type="module"></script>
  </body>
</html>
